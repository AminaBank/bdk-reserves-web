name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - v[0-9]+.*

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          # (optional) Path to changelog.
          changelog: CHANGELOG.md
          # (required) GitHub token for creating GitHub Releases.
          token: ${{ secrets.GITHUB_TOKEN }}

  # The app is a static site now, so the release asset is the site itself
  # rather than a server binary.
  upload-site:
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      - name: Set default toolchain
        run: rustup default 1.97.1
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Build the static site
        run: make build
      - name: Package it
        run: tar czf bdk-reserves-web-${{ github.ref_name }}.tar.gz -C dist .
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} bdk-reserves-web-*.tar.gz
